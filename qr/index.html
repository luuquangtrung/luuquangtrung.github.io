<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Code Generator | Quang-Trung Luu</title>
  <meta name="description" content="Simple QR code generator for text and URLs.">

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f7f7f8;
      color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .wrapper {
      width: 100%;
      max-width: 680px;
    }

    .top-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .top-link:hover {
      text-decoration: underline;
    }

    .card {
      background: white;
      border: 1px solid #e3e3e3;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #666;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 14px;
      border: 1px solid #cfcfcf;
      border-radius: 10px;
      resize: vertical;
      font: inherit;
      line-height: 1.45;
      background: white;
      color: #202124;
    }

    textarea:focus {
      outline: none;
      border-color: #555;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-top: 14px;
    }

    select,
    button {
      min-height: 44px;
      border-radius: 9px;
      font: inherit;
    }

    select {
      width: 100%;
      padding: 0 12px;
      border: 1px solid #cfcfcf;
      background: white;
      color: #202124;
    }

    button {
      border: none;
      padding: 0 18px;
      cursor: pointer;
      font-weight: 600;
    }

    #generateBtn {
      background: #202124;
      color: white;
    }

    #generateBtn:hover {
      background: #000;
    }

    #downloadBtn {
      background: #ededed;
      color: #202124;
    }

    #downloadBtn:hover {
      background: #dedede;
    }

    #message {
      min-height: 20px;
      margin-top: 8px;
      color: #b42318;
      font-size: 14px;
    }

    #qrArea {
      display: none;
      margin-top: 26px;
      padding-top: 26px;
      border-top: 1px solid #e5e5e5;
      text-align: center;
    }

    #qrcode {
      display: inline-block;
      padding: 16px;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      background: white;
      max-width: 100%;
      overflow: auto;
    }

    #qrcode canvas,
    #qrcode img {
      display: block;
      max-width: 100%;
      height: auto !important;
    }

    .download-row {
      margin-top: 16px;
    }

    footer {
      margin-top: 16px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 560px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 20px;
      }

      .row {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <a class="top-link" href="/">← Back to homepage</a>

    <main class="card">
      <h1>QR Code Generator</h1>
      <p class="subtitle">
        Generate a QR code from any text or URL directly in your browser.
      </p>

      <label for="qrText">Text or URL</label>

      <textarea id="qrText" placeholder="https://luuquangtrung.github.io/" autofocus></textarea>

      <div id="message"></div>

      <div class="row">
        <select id="qrSize" aria-label="QR code size">
          <option value="200">200 × 200 px</option>
          <option value="300" selected>300 × 300 px</option>
          <option value="400">400 × 400 px</option>
          <option value="500">500 × 500 px</option>
          <option value="800">800 × 800 px</option>
        </select>

        <button id="generateBtn" type="button">
          Generate QR
        </button>
      </div>

      <section id="qrArea">
        <div id="qrcode"></div>

        <div class="download-row">
          <button id="downloadBtn" type="button">
            Download PNG
          </button>
        </div>
      </section>
    </main>

    <footer>
      Quang-Trung Luu · QR utility
    </footer>
  </div>

  <script>
    const input = document.getElementById("qrText");
    const sizeSelect = document.getElementById("qrSize");
    const generateBtn = document.getElementById("generateBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const qrcode = document.getElementById("qrcode");
    const qrArea = document.getElementById("qrArea");
    const message = document.getElementById("message");

    function generateQR() {
      const text = input.value.trim();
      const size = parseInt(sizeSelect.value, 10);

      message.textContent = "";

      if (!text) {
        qrArea.style.display = "none";
        message.textContent = "Please enter some text or a URL.";
        input.focus();
        return;
      }

      if (typeof QRCode === "undefined") {
        message.textContent = "QR library could not be loaded.";
        return;
      }

      qrcode.innerHTML = "";

      new QRCode(qrcode, {
        text: text,
        width: size,
        height: size,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      qrArea.style.display = "block";
    }

    function downloadQR() {
      const canvas = qrcode.querySelector("canvas");
      const image = qrcode.querySelector("img");

      let dataUrl = null;

      if (canvas) {
        dataUrl = canvas.toDataURL("image/png");
      } else if (image) {
        dataUrl = image.src;
      }

      if (!dataUrl) {
        message.textContent = "Generate a QR code first.";
        return;
      }

      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = "qrcode.png";
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    generateBtn.addEventListener("click", generateQR);
    downloadBtn.addEventListener("click", downloadQR);

    input.addEventListener("keydown", function (event) {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        generateQR();
      }
    });

    const params = new URLSearchParams(window.location.search);
    const preset = params.get("text");

    if (preset) {
      input.value = preset;
      generateQR();
    }
  </script>
</body>
</html>
